openapi: 3.0.3
info:
  contact:
    email: data-platform@forgesphere.example.com
    name: ForgeSphere Data Platform
  description: "Enforces data contracts between Kafka producers and consumers. Prevents\
    \ \nthe #1 cause of streaming pipeline outages: silent schema changes that \n\
    break downstream consumers. Every message produced to a topic is validated \n\
    against a registered contract before being published. Breaking changes \nrequire\
    \ explicit consumer acknowledgment, ensuring no surprises in \nproduction. Supports\
    \ Avro, Protobuf, and JSON Schema formats.\n"
  title: Streaming Data Contract Enforcer
  version: 1.0.0
servers:
- description: Production Server
  url: https://data-contract.forgesphere.lightning.com/v1
- description: Local Development Server
  url: http://localhost:8149/v1
security:
- bearerAuth: []
tags:
- description: Register and manage producer/consumer data contracts.
  name: Contracts
- description: Track and resolve schema violations.
  name: Violations
paths:
  /contracts:
    get:
      description: "Returns all data contracts with filters. Used by platform teams\
        \ to \naudit coverage (\"which topics are still unprotected?\") and by service\
        \ \nowners to see their contracts.\n"
      operationId: listContracts
      parameters:
      - description: Filter by producer team.
        example: payments-team
        explode: true
        in: query
        name: producerTeam
        required: false
        schema:
          type: string
        style: form
      - description: Filter by consumer team.
        example: analytics-team
        explode: true
        in: query
        name: consumerTeam
        required: false
        schema:
          type: string
        style: form
      - description: Filter by Kafka cluster.
        example: prod-kafka-us-east-1
        explode: true
        in: query
        name: clusterName
        required: false
        schema:
          type: string
        style: form
      - description: Filter by enforcement level.
        explode: true
        in: query
        name: enforcementLevel
        required: false
        schema:
          enum:
          - BLOCK
          - WARN
          - AUDIT_ONLY
          type: string
        style: form
      - description: Filter by schema format.
        explode: true
        in: query
        name: schemaFormat
        required: false
        schema:
          enum:
          - AVRO
          - PROTOBUF
          - JSON_SCHEMA
          type: string
        style: form
      - description: Only include contracts with violations in last 24h.
        explode: true
        in: query
        name: hasRecentViolations
        required: false
        schema:
          type: boolean
        style: form
      - description: Page number (zero-based).
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Number of items per page.
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractList"
          description: List of contracts retrieved successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: List all registered data contracts
      tags:
      - Contracts
      x-accepts: application/json
      x-tags:
      - tag: Contracts
    post:
      description: "Registers a data contract — a formal agreement between the producer\
        \ \nand all consumers of a Kafka topic. The contract specifies the schema,\
        \ \ncompatibility mode, and enforcement level. Once active, every message\
        \ \npublished to the topic must conform to the schema. Schema changes \ntrigger\
        \ validation against the compatibility rules.\n"
      operationId: registerContract
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/registerContract_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
          description: Contract registered and active.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A contract already exists for this topic and cluster.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Register a new data contract for a Kafka topic
      tags:
      - Contracts
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Contracts
  /contracts/{contractId}:
    get:
      description: "Returns the full contract — schema, version history, producer/consumer\
        \ \nteams, violation statistics, and compatibility rules. Includes current\
        \ \nschema drift status and any pending breaking changes awaiting consumer\
        \ \napproval.\n"
      operationId: getContract
      parameters:
      - description: Unique identifier of the contract.
        example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        explode: false
        in: path
        name: contractId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Include recent violations in the response.
        example: true
        explode: true
        in: query
        name: includeViolationHistory
        required: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
          description: Contract details retrieved successfully.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Contract or violation not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Get detailed information about a specific contract
      tags:
      - Contracts
      x-accepts: application/json
      x-tags:
      - tag: Contracts
  /contracts/{contractId}/validate:
    post:
      description: "Synchronously validates a message payload against the contract\
        \ schema \nbefore it's published to Kafka. Returns VALID, INVALID, or \nCOMPATIBILITY_VIOLATION\
        \ with detailed error info. This is the hot-path \nendpoint called by producer\
        \ SDKs on every message (latency target: \n<5ms via client-side caching).\n"
      operationId: validateMessage
      parameters:
      - description: Unique identifier of the contract.
        example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        explode: false
        in: path
        name: contractId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/validateMessage_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
          description: Validation result.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Contract or violation not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Validate a message against the contract before publishing
      tags:
      - Contracts
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Contracts
  /violations:
    get:
      description: "Returns all schema violations detected across all contracts. Used\
        \ by \nplatform teams to identify rogue producers, spot emerging schema drift,\
        \ \nand prioritize which contracts need attention. Supports filtering by \n\
        contract, producer, severity, and time window.\n"
      operationId: listViolations
      parameters:
      - description: Filter by contract.
        example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        explode: true
        in: query
        name: contractId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Filter by producer service.
        example: payment-processor
        explode: true
        in: query
        name: producerService
        required: false
        schema:
          type: string
        style: form
      - description: Filter by severity.
        example: CRITICAL
        explode: true
        in: query
        name: severity
        required: false
        schema:
          enum:
          - WARNING
          - ERROR
          - CRITICAL
          type: string
        style: form
      - description: Filter by violation type.
        explode: true
        in: query
        name: violationType
        required: false
        schema:
          enum:
          - SCHEMA_MISMATCH
          - MISSING_FIELD
          - EXTRA_FIELD
          - TYPE_MISMATCH
          - NULL_VIOLATION
          - COMPATIBILITY_BREAK
          - ENUM_VIOLATION
          type: string
        style: form
      - description: Filter by violation status.
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
          - IGNORED
          type: string
        style: form
      - description: Only include violations after this time.
        explode: true
        in: query
        name: fromDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Only include violations before this time.
        explode: true
        in: query
        name: toDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Page number (zero-based).
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Number of items per page.
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViolationList"
          description: List of violations retrieved successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: List contract violations across all topics
      tags:
      - Violations
      x-accepts: application/json
      x-tags:
      - tag: Violations
